[project]
name = "asr-nec-app"
version = "0.1.0"
description = "Full-stack demo application for the ASR NEC (SpeechSearcher + GenerativeLabeler) models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.0",
    "fastapi>=0.124.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.14.1",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.27",
    "swagger-ui-bundle>=1.1.0",
    "uvicorn[standard]>=0.38.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
nec = [
    "asr-nec-model",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["configs", "controllers", "core", "extensions", "models", "services"]

[tool.uv.sources]
asr-nec-model = { path = "../asr-nec-model", editable = true }

[tool.uv]
index-url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff.lint]
# FastAPI intentionally uses Depends/Form/File calls as parameter defaults.
ignore = ["B008"]
